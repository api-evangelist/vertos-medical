aid: vertos-medical
name: Vertos Medical
description: 'Vertos Medical, Inc. is a medical device company founded in 2005 and headquartered
  in Aliso Viejo, California, that developed the mild (minimally invasive lumbar decompression)
  procedure for treating lumbar spinal stenosis caused by hypertrophic ligamentum flavum. The
  mild device kit removes excess ligament tissue through a 5.1 mm treatment portal with no
  implants, no general anesthesia and no stitches; it received FDA clearance in 2006 and CE mark
  approval in 2019. Stryker announced a definitive agreement to acquire Vertos Medical in August
  2024 and completed the acquisition on October 1, 2024, folding the mild procedure into its
  Interventional Spine business. The vertosmed.com domain now answers every path with a site-wide
  HTTP 301 redirect to Stryker, and Vertos Medical publishes no developer program, API, SDK or
  machine-readable specification of its own.'
